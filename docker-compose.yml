services:
  gamekeep:
    # The published image; nothing to clone or build. To build from source
    # instead, uncomment the build line and run: docker compose up -d --build
    image: ghcr.io/kengoossens/gamekeep:latest
    #build: .
    container_name: gamekeep
    restart: unless-stopped
    env_file: .env

    # Only needed to reach the portal directly on the LAN. Behind a reverse
    # proxy or a Cloudflare Tunnel on the same network, delete this block --
    # then the portal has no published port at all.
    ports:
      - "8088:8080"

    volumes:
      # The one thing that makes this work: the portal restarts containers
      # through Docker. Root-equivalent on the host -- see the README's
      # security model, and the socket-proxy alternative below.
      - /var/run/docker.sock:/var/run/docker.sock

      # Sessions, audit log, metrics and cached artwork.
      # SQLite dislikes network filesystems: on Unraid use a pool path
      # (/mnt/cache/...) rather than the /mnt/user FUSE layer.
      - ./data:/data

      # Read-only on purpose: this file IS the container whitelist.
      - ./config:/config:ro

      # Where servers deployed through the portal keep their data. Must match
      # APPDATA_HOST_ROOT in .env -- the left side is what the host sees.
      - /srv/gameservers:/gameservers

      # Unraid only: lets deployed servers show up in the Docker tab.
      # Remove this line on any other host.
      #- /boot/config/plugins/dockerMan/templates-user:/unraid-templates

    networks:
      - gamekeep

networks:
  gamekeep:
    driver: bridge

# --- Optional: put a tunnel in front -----------------------------------------
# Publishes the portal without opening a port on your router. Point the tunnel
# at http://gamekeep:8080 and delete the ports: block above.
#
#  cloudflared:
#    image: cloudflare/cloudflared:latest
#    container_name: cloudflared
#    restart: unless-stopped
#    command: tunnel --no-autoupdate run
#    environment:
#      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
#    networks:
#      - gamekeep

# --- Optional hardening ------------------------------------------------------
# Narrow the socket: a proxy that only passes the Docker API groups GameKeepr
# actually uses. Set DOCKER_HOST=http://gamekeep-dockerproxy:2375 on the
# gamekeep service, drop its docker.sock volume, and put both on one network.
#
# This preset is TESTED against every feature: status, restart, logs, files,
# console, mods, backups and a full Steam deploy all work through it, while
# /volumes, /secrets, /swarm, /system and /plugins answer 403.
#
# Be honest about the gain: GameKeepr needs container creation (deploys) and
# exec (files, mods, backups), and the proxy cannot inspect request bodies --
# so it does not stop a compromised portal from creating a privileged
# container. What it removes is everything else: the endpoints a portal has
# no business reaching at all.
#
#  dockerproxy:
#    image: tecnativa/docker-socket-proxy:latest
#    container_name: gamekeep-dockerproxy
#    restart: unless-stopped
#    environment:
#      CONTAINERS: 1   # list, inspect, stats, logs, archive (files/backups)
#      POST: 1         # restart, stop, start, create (deploys), attach (console)
#      IMAGES: 1       # pulling the image a deploy needs
#      NETWORKS: 1     # the game network deploys join -- without this, deploys break
#      EXEC: 1         # the file browser, mods and save discovery
#      # Everything else stays off: no VOLUMES, no SECRETS, no SWARM, no PLUGINS.
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock:ro
#    networks:
#      - gamekeep
